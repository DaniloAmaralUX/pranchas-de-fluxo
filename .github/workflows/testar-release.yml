name: Testar instalador público
on: workflow_dispatch
permissions: {}
jobs:
  instalar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - name: Instalar por URL e abrir o exemplo como arquivo
        shell: bash
        env:
          RELEASE_URL: https://github.com/DaniloAmaralUX/pranchas-de-fluxo/releases/download/v1.0.0/pranchas-de-fluxo-1.0.0.tgz
        run: |
          set -eu
          export npm_config_cache="$PWD/npm-cache"
          mkdir projeto
          cd projeto
          npx --yes "$RELEASE_URL" --ideia "A gerente confere o pedido."
          node .pranchas/cli.cjs exemplo demo
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const [job] = readdirSync('.pranchas/entradas');
          assert.match(readFileSync('.pranchas/entradas/' + job + '/briefing.md', 'utf8'), /confere o pedido/);
          const html = readFileSync('demo/index.html', 'utf8');
          const json = html.match(/<script[^>]*\bid="drawing-data"[^>]*>([\s\S]*?)<\/script>/);
          assert.ok(json, 'Dados das pranchas ausentes');
          const telas = JSON.parse(json[1]);
          assert.equal(telas.length, 4);
          for (const tela of telas) assert.ok(tela.rules.length && tela.requirement.length <= 90);
          JS
